<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>冷月系—第三方平台</title><link rel="stylesheet" href="style.css"></head><body><aside><h2>◈ 第三方平台</h2><p>YEPSTAR · 冷月系</p><a href="#accounts">平台账号</a><a href="#schedule">自主安排</a><a href="#activity">活动记录</a><small>首版 · 旧插件已保留供对比</small></aside><main><header><div><p>YEPSTAR · 冷月系</p><h1>第三方平台</h1><p>管理平台账号、浏览安排与内容分享。</p></div><button id="refresh">刷新</button><button id="pause"></button></header><p id="readiness"></p><p id="feedback" role="status"></p><section id="accounts"><h2>平台账号</h2><div id="account-list"></div><form id="account-form"><h3>添加或调整账号</h3><div class="grid"><label>平台<select name="provider"><option value="bilibili">B站</option><option value="xiaoheihe">小黑盒</option><option value="netease">网易云音乐</option></select></label><label>账号标识<input name="account" pattern="[A-Za-z0-9_-]{1,64}" value="default" required></label></div><div id="account-fields" class="grid"></div><button>保存账号策略</button></form><p>模型、公共人格、活动时间窗及全局评分在 AstrBot 插件配置中设置。迁移检查通过后可以启动自主活动。网易云登录、播放及邀请仍由音乐插件管理。</p><div id="login" hidden><img id="login-image" alt="平台登录二维码" width="220" height="220"><p>使用机器人账号扫码后点击对应账号的“检查登录”。</p></div></section><section id="schedule"><h2>自主安排</h2><p id="timezone"></p><div id="tasks"></div><form id="schedule-form"><h3>增加浏览时间窗</h3><div class="grid"><label>平台<select name="provider"><option value="bilibili">B站</option><option value="xiaoheihe">小黑盒</option><option value="netease">网易云音乐</option></select></label><label>账号标识<input name="account" value="default" required></label><label>开始<input name="start" type="datetime-local" required></label><label>结束<input name="end" type="datetime-local" required></label></div><button>保存安排</button></form></section><section id="activity"><h2>活动记录</h2><pre id="actions"></pre></section></main><dialog id="move-dialog"><form id="move-form"><h2>调整安排</h2><label>开始<input name="start" type="datetime-local" required></label><label>结束<input name="end" type="datetime-local" required></label><button type="button" id="move-close">取消</button><button>保存时间</button></form></dialog><script type="module" src="app.js"></script></body></html>
