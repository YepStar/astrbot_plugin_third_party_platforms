<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>冷月系—第三方平台</title><link rel="stylesheet" href="style.css"></head><body><aside><h2>◈ 第三方平台</h2><p>YEPSTAR · 冷月系</p><a href="#accounts">平台账号</a><a href="#schedule">自主安排</a><a href="#activity">活动记录</a><small>开发版本 · 尚未完成旧插件替换</small></aside><main><header><div><p>YEPSTAR · 冷月系</p><h1>第三方平台</h1><p>管理平台账号、浏览安排与内容分享。</p></div><button id="refresh">刷新</button><button id="pause"></button></header><p id="feedback" role="status"></p><section id="accounts"><h2>平台账号</h2><div id="account-list"></div><form id="account-form"><h3>添加或调整账号</h3><div class="grid"><label>平台<select name="provider"><option value="bilibili">B站</option><option value="xiaoheihe">小黑盒</option></select></label><label>账号标识<input name="account" pattern="[A-Za-z0-9_-]{1,64}" value="default" required></label><label>私聊分享目的地<input name="owner_umo" placeholder="qq_bot:FriendMessage:QQ号"></label><label>搜索词（B站）<input name="query"></label><label>盒子分区编号（小黑盒）<input name="topic_id"></label><label>分享最低评分<input name="share_min_score" type="number" min="1" max="10" step="0.1" value="8"></label></div><label><input name="enabled" type="checkbox">启用此账号</label><label><input name="share_enabled" type="checkbox">允许向指定私聊分享</label><button>保存账号策略</button></form><p>模型、公共人格、活动时间窗及全局评分在 AstrBot 插件配置中设置。公开评论、私信回复及音乐接管尚在迁移中，本开发版本暂不启用。</p><div id="login" hidden><a id="login-link" target="_blank" rel="noopener">打开平台登录二维码页面</a><p>使用机器人账号扫码后点击对应账号的“检查登录”。</p></div></section><section id="schedule"><h2>自主安排</h2><p id="timezone"></p><div id="tasks"></div><form id="schedule-form"><h3>增加浏览时间窗</h3><div class="grid"><label>平台<select name="provider"><option value="bilibili">B站</option><option value="xiaoheihe">小黑盒</option></select></label><label>账号标识<input name="account" value="default" required></label><label>开始<input name="start" type="datetime-local" required></label><label>结束<input name="end" type="datetime-local" required></label></div><button>保存安排</button></form></section><section id="activity"><h2>活动记录</h2><pre id="actions"></pre></section></main><script type="module" src="app.js"></script></body></html>
